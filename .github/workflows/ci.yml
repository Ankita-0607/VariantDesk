name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: variantdesk
          POSTGRES_PASSWORD: variantdesk
          POSTGRES_DB: variantdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U variantdesk" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://variantdesk:variantdesk@localhost:5432/variantdesk
      JWT_SECRET: ci-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
        working-directory: apps/api
